# Git hooks, all driven by the mise-pinned tools. Install locally with
# `mise exec -- lefthook install`; CI runs the pre-push gate + commitlint too.
# Gates are meant to hold — don't push with --no-verify. Override locally, if you
# must, via an un-committed lefthook-local.yml.

# ─── Commit message: conventional-commit lint ────────────────────────────────
commit-msg:
  commands:
    commitlint:
      run: mise exec -- commitlint --edit {1}
      fail_text: "Commit message must be a Conventional Commit (e.g. 'fix: …', 'feat(scope): …')."

# ─── Pre-commit: auto-format the staged files (fast) ─────────────────────────
pre-commit:
  parallel: true
  commands:
    swift-format:
      glob: "*.swift"
      run: mise exec -- swiftformat {staged_files}
      stage_fixed: true
    python-format:
      glob: "*.py"
      run: mise exec -- ruff format {staged_files}
      stage_fixed: true
    shell-format:
      glob: "*.sh"
      run: mise exec -- shfmt -i 2 -w {staged_files}
      stage_fixed: true
    json-format:
      glob: "*.json"
      run: mise exec -- oxfmt {staged_files}
      stage_fixed: true
    web-format:
      glob: "*.{ts,tsx}"
      run: mise exec -- oxfmt {staged_files}
      stage_fixed: true

# ─── Pre-push: the full format-check + lint gate (also run in CI) ────────────
pre-push:
  parallel: true
  commands:
    # Gates are unskippable. `bin/git` refuses `git push --no-verify`; this refuses the
    # LEFTHOOK=0 / LEFTHOOK_EXCLUDE env bypasses (which act at lefthook's own hook wrapper).
    no-bypass:
      run: |
        if [ -n "${LEFTHOOK_EXCLUDE:-}" ] || [ "${LEFTHOOK:-}" = "0" ]; then
          echo "BLOCKED: lefthook gates are unskippable (LEFTHOOK/LEFTHOOK_EXCLUDE set)." >&2
          exit 1
        fi
      fail_text: "Gate bypass attempted. Fix the failing check, do not skip."
    # Enforce CI == lefthook parity and that no test input is hidden by .gitignore.
    preflight:
      run: ./bin/preflight.sh
    swift-format:
      run: cd packages/products/harvest-autofill && mise exec -- swiftformat --lint HarvestCore.swift HarvestSideEffects.swift HarvestApp.swift SwiftTests
    swift-lint:
      # SwiftLint needs sourcekit from a full Xcode. Use the selected Xcode (CI), or fall
      # back to any installed Xcode.app when only Command Line Tools are selected (local).
      run: cd packages/products/harvest-autofill && DEV="$(xcode-select -p)"; case "$DEV" in *CommandLineTools*) DEV="$(ls -d /Applications/Xcode*.app/Contents/Developer 2>/dev/null | head -1)";; esac; DEVELOPER_DIR="$DEV" mise exec -- swiftlint lint --strict --quiet
    python-format:
      run: cd packages/products/harvest-autofill && mise exec -- ruff format --check *.py
    python-lint:
      run: cd packages/products/harvest-autofill && mise exec -- ruff check *.py
    shell-format:
      run: mise exec -- shfmt -i 2 -d $(git ls-files '*.sh' bin/git)
    shell-lint:
      run: mise exec -- shellcheck $(git ls-files '*.sh' bin/git)
    toml:
      # taplo's formatter panics on mise's `_.path` dotted key (upstream bug), so lint only.
      run: mise exec -- taplo lint mise.toml
    json-format:
      run: cd packages/products/harvest-autofill && mise exec -- oxfmt --check config.default.json
    yaml-lint:
      run: mise exec -- yamllint .github/workflows/
    workflow-lint:
      run: mise exec -- actionlint
    markdown-lint:
      run: mise exec -- markdownlint-cli2 "*.md"
    web-format:
      run: cd packages/products/website && mise exec -- oxfmt --check src
    web-lint:
      run: cd packages/products/website && mise exec -- oxlint src
    astro-format:
      run: cd packages/products/website && mise exec -- pnpm exec prettier --check "src/**/*.astro"
    css-lint:
      run: cd packages/products/website && mise exec -- pnpm exec stylelint "src/**/*.css"
    # ── Test suites (unit + behaviour + coverage). Visual regression + Playwright E2E are
    #    heavier (need a built app / a browser) and run in CI — see .github/workflows/test.yml.
    python-test:
      run: cd packages/products/harvest-autofill && mise exec -- uv run --python 3.12 --group dev pytest --cov
    swift-test:
      run: cd packages/products/harvest-autofill && ./swift-coverage-gate.sh
    web-test:
      run: cd packages/products/website && mise exec -- pnpm exec vitest run --coverage
    # App render visual regression (macOS only — builds the signed app, then pixel-diffs every
    # screen vs its baseline). Scoped to app sources so unrelated commits don't rebuild.
    app-visual:
      glob: "packages/products/harvest-autofill/*.{swift,py}"
      run: cd packages/products/harvest-autofill && ./build.sh >/dev/null && mise exec -- uv run --python 3.12 --with pillow visual-check.py
    # Website E2E + visual regression in the pinned Playwright container. Runs wherever Docker
    # is available (dev machines, the ubuntu CI job); on a Docker-less runner it defers to the
    # web-e2e.yml CI job. Scoped to website sources.
    web-e2e:
      glob: "packages/products/website/**"
      run: |
        cd packages/products/website
        if docker info >/dev/null 2>&1; then
          ./run-web-e2e.sh
        else
          echo "web-e2e: Docker unavailable here — this check runs in the web-e2e.yml CI job."
        fi

# ─── Keep the workspace toolchain in sync after branch switches / merges ──────
post-checkout:
  commands:
    mise-sync:
      run: mise install
post-merge:
  commands:
    mise-sync:
      run: mise install
