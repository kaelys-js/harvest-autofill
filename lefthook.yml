# Git hooks, all driven by the mise-pinned tools. Install locally with
# `mise exec -- lefthook install`; CI runs the pre-push gate + commitlint too.
# Gates are meant to hold — don't push with --no-verify. Override locally, if you
# must, via an un-committed lefthook-local.yml.
#
# Every tool stage runs through turbo (`turbo run qa:<name>`) so unchanged
# inputs are a cache hit locally and in CI (see turbo.json + package.json qa:* scripts).

# ─── Commit message: conventional-commit lint ────────────────────────────────
commit-msg:
  commands:
    commitlint:
      run: mise exec -- commitlint --edit {1}
      fail_text: "Commit message must be a Conventional Commit (e.g. 'fix: …', 'feat(scope): …')."

# ─── Pre-commit: auto-format the staged files (fast) ─────────────────────────
pre-commit:
  parallel: true
  commands:
    swift-format:
      glob: "*.swift"
      run: mise exec -- swiftformat {staged_files}
      stage_fixed: true
    python-format:
      glob: "*.py"
      run: mise exec -- ruff format {staged_files}
      stage_fixed: true
    shell-format:
      glob: "*.sh"
      run: mise exec -- shfmt -i 2 -w {staged_files}
      stage_fixed: true
    format:
      glob: "*.{json,jsonc,mjs,cjs,js,ts,tsx}"
      run: mise exec -- oxfmt {staged_files}
      stage_fixed: true
    web-format:
      glob: "*.{ts,tsx}"
      run: mise exec -- oxfmt {staged_files}
      stage_fixed: true

# ─── Pre-push: the full format-check + lint + test gate (also run in CI) ──────
#     Each stage is `turbo run qa:<name>`: turbo caches on the task's inputs
#     (see turbo.json), so an unchanged surface is a cache hit. The Checks CI job
#     runs this whole gate; web-e2e also runs in web-e2e.yml (container).
pre-push:
  parallel: true
  commands:
    # Gates are unskippable. `bin/git` refuses `git push --no-verify`; this refuses the
    # LEFTHOOK=0 / LEFTHOOK_EXCLUDE env bypasses (which act at lefthook's own hook wrapper).
    no-bypass:
      run: |
        if [ -n "${LEFTHOOK_EXCLUDE:-}" ] || [ "${LEFTHOOK:-}" = "0" ]; then
          echo "BLOCKED: lefthook gates are unskippable (LEFTHOOK/LEFTHOOK_EXCLUDE set)." >&2
          exit 1
        fi
      fail_text: "Gate bypass attempted. Fix the failing check, do not skip."
    # Enforce CI == lefthook parity and that no test input is hidden by .gitignore.
    preflight:
      run: ./bin/preflight.sh
    swift-format:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:swift-format
    swift-lint:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:swift-lint
    python-format:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:python-format
    python-lint:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:python-lint
    shell-format:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:shell-format
    shell-lint:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:shell-lint
    toml:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:toml
    format:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:format
    lint:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:lint
    yaml-lint:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:yaml-lint
    workflow-lint:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:workflow-lint
    markdown-lint:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:markdown-lint
    # VERSION must match CHANGELOG.md's top released heading, so they never drift ahead of the
    # release tag (release.yml re-checks the tag against both before publishing).
    version-changelog:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:version-changelog
    web-format:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:web-format
    web-lint:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:web-lint
    web-typecheck:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:web-typecheck
    astro-format:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:astro-format
    css-lint:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:css-lint
    python-test:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:python-test
    swift-test:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:swift-test
    web-test:
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:web-test
    # App render visual regression (macOS only — builds the signed app, then pixel-diffs every
    # screen vs its baseline). turbo caches on app sources + baselines so unchanged commits skip it.
    app-visual:
      glob: "packages/products/harvest-autofill/*.{swift,py}"
      run: ./bin/mise exec -- ./node_modules/.bin/turbo run qa:app-visual
    # Website E2E + visual regression in the pinned Playwright container. Runs wherever Docker
    # is available (dev machines, the ubuntu CI job); on a Docker-less runner it defers to the
    # web-e2e.yml CI job. Scoped to website sources.
    web-e2e:
      glob: "packages/products/website/**"
      run: |
        if docker info >/dev/null 2>&1; then
          ./bin/mise exec -- ./node_modules/.bin/turbo run qa:web-e2e
        else
          echo "web-e2e: Docker unavailable here — this check runs in the web-e2e.yml CI job."
        fi

# ─── Keep the workspace toolchain in sync after branch switches / merges ──────
post-checkout:
  commands:
    mise-sync:
      run: ./bin/mise install
post-merge:
  commands:
    mise-sync:
      run: ./bin/mise install
