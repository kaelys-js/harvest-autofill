#:schema packages/shared/schemas/tooling/mise/schema.json
#
# @generated — do not edit directly. Managed by @/cli/tools/sync.
# https://mise.jdx.dev/configuration.html
#

# min_version is intentionally NOT declared. It would gate mise activation
# on the HOST binary's version, and a failed gate blocks the [env] block
# from being applied — which is where the workspace-mise PATH hijack lives.
# The pinned mise version is enforced by `./bin/mise` (which installs and
# execs `.mise/mise-2026.7.15`) regardless of what
# the host mise happens to be; `[env]._.path` below then puts that wrapper
# first on PATH for every subsequent command in the workspace.

[settings]
# Ignore legacy version files (.nvmrc, .node-version, .ruby-version) for
# Node — let the [tools] block in this file be the single source of truth.
# Exception: ui/ios/App/.ruby-version stays read so Bundler picks it up.
# Read .nvmrc for Node version (generated by sync from versions.node)
idiomatic_version_file_enable_tools = ["node", "ruby"]

# Corepack OFF: mise owns pnpm (pinned via `versions.systemTools`), not corepack.
# Kept consistent with the `COREPACK_ENABLE_STRICT = "0"` env line below.
node.corepack = false

# Faster install path — uses precompiled binaries when available
experimental = true

# Don't auto-install missing tool versions on `mise activate` — explicit
# `mise install` is safer for collaborators who might not realize a
# multi-GB Ruby compile is queued.
auto_install = false

# Lockfile — once mise.lock exists, mise refuses to install versions
# that don't match (signed SHAs). First `mise install` creates it.
lockfile = true

[env]
# Workspace-scoped tool installations — all binaries live inside the repo
MISE_INSTALLS_DIR = "{{config_root}}/.mise/installs"

# Prepend `./bin` so a bare `mise` invocation inside this workspace resolves
# to `./bin/mise` (the pinned wrapper that execs `.mise/mise-<pin>`), NOT
# the host `mise` binary. Combined with the tool activation mise already
# does (adds `.mise/installs/<tool>/<ver>/bin` to PATH), this means every
# command — `mise`, `node`, `pnpm`, `oxlint`, `ruff`, everything — resolves
# to workspace-pinned binaries automatically on `cd`, without any user
# shell-config edit beyond the standard `mise activate` line.
_.path = [
  "{{config_root}}/bin",
  # uv-tool install target for azure-cli (see runToolInstallPipeline). Putting
  # it on PATH here silences uv's "not on your PATH" warning AND lets bare
  # `az` resolve without going through bin/az.
  "{{config_root}}/.mise/uv-tools/bin",
]

# mise manages package manager not corepack
COREPACK_ENABLE_STRICT = "0"

# Bootstrap the @/ tsconfig-paths loader for every Node process spawned in
# this workspace. Set on shell env via `mise activate`, so it inherits into
# `pnpm`, `pnpm install`'s lifecycle-script subprocesses (which is where
# svelte.config.ts's @/config import resolves), and any bare `node` /
# `tsx` invocation. Path is workspace-relative via `config_root`.
NODE_OPTIONS = "--disable-warning=DEP0205 --import {{config_root}}/packages/shared/config/tooling/node/src/register-aliases.mjs"

