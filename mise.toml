# Workspace toolchain for Harvest Auto-Fill. `mise install` sets up every tool the
# project builds, lints, and releases with, pinned for reproducibility across dev + CI.
#
# Note: the Swift compiler (swiftc) comes from Xcode / Command Line Tools and is not
# managed here; mise pins the Swift *linters* (SwiftFormat, SwiftLint) instead.

[settings]
# npm/asdf backends are needed for oxfmt/oxlint/taplo/markdownlint and SwiftFormat.
experimental = true

[tools]
# Runtimes the tooling + scripts need
node = "22"
python = "3.12"

# Formatters + linters (versions track the foundation repo's choices)
ruff = "0.16.0"                                 # Python format + lint
shfmt = "3.13.1"                                # shell format
"aqua:koalaman/shellcheck" = "0.11.0"           # shell lint
"npm:@taplo/cli" = "0.7.0"                      # TOML format + lint
"npm:oxfmt" = "0.65.0"                          # JSON/JS format
"npm:oxlint" = "1.76.0"                         # JSON/JS lint
yamllint = "1.38.0"                             # YAML lint
actionlint = "1.7.11"                           # GitHub workflow lint
"npm:markdownlint-cli2" = "0.23.2"              # Markdown lint
"aqua:realm/SwiftLint" = "0.65.0"               # Swift lint
"asdf:mise-plugins/mise-swiftformat" = "0.62.1" # Swift format (nicklockwood)

# Orchestration + release tooling
lefthook = "2.1.12" # pre-push hooks (also run in CI)
gh = "latest"       # used by release.sh to publish
