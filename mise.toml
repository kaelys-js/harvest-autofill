# Workspace toolchain for Harvest Auto-Fill. `mise install` sets up every tool the
# project builds, lints, and releases with, pinned for reproducibility across dev + CI.
#
# Note: the Swift compiler (swiftc) comes from Xcode / Command Line Tools and is not
# managed here; mise pins the Swift *linters* (SwiftFormat, SwiftLint) instead.

[settings]
# npm/asdf backends are needed for oxfmt/oxlint/taplo/markdownlint and SwiftFormat.
experimental = true
lockfile = true       # once mise.lock exists, refuse versions that don't match it
auto_install = false  # explicit `mise install` only — no surprise downloads on cd

[env]
# MISE_INSTALLS_DIR scopes tool installs to .mise/installs inside the repo (self-contained).
# _.path prepends ./bin so a bare `mise` resolves to the pinned ./bin/mise wrapper.
MISE_INSTALLS_DIR = "{{ config_root }}/.mise/installs"
_.path = ["{{ config_root }}/bin"]

[tools]
# Runtimes the tooling + scripts need
node = "26.8.1"
python = "3.12.14"

# Formatters + linters (versions track the foundation repo's choices)
ruff = "0.16.5"                                 # Python format + lint
shfmt = "3.14.0"                                # shell format
"aqua:koalaman/shellcheck" = "0.11.0"           # shell lint
"npm:@taplo/cli" = "0.7.0"                      # TOML format + lint
"npm:oxfmt" = "0.65.0"                          # JSON/JS format
"npm:oxlint" = "1.80.0"                         # JSON/JS lint
yamllint = "1.38.0"                             # YAML lint
actionlint = "1.7.12"                           # GitHub workflow lint
"npm:markdownlint-cli2" = "0.23.2"              # Markdown lint
"npm:@commitlint/cli" = "21.2.2"                # commit-message lint
"aqua:realm/SwiftLint" = "0.65.1"               # Swift lint
"asdf:mise-plugins/mise-swiftformat" = "0.63.0" # Swift format (nicklockwood)

# Orchestration + release tooling
lefthook = "2.1.12" # pre-push hooks (also run in CI)
gh = "latest"       # used by release.sh to publish
pnpm = "11.24.0"    # website package manager
uv = "0.12.7"       # runs the Python engine test suite (pytest + coverage)
