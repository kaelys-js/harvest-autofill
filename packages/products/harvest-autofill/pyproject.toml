[project]
name = "harvest-autofill-engine"
version = "0.0.0"
description = "Tests for the Harvest Auto-Fill engine (the app ships the .py files directly)."
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0"]

# Not an installable package — just scripts + a test suite.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["harvest_weekly", "discover"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
