name: Release
# Push an annotated version tag (e.g. v2.12) to build, sign, and publish that release.
# The changelog goes in the tag message: git tag -a v2.12 -m "## Changes…"; git push origin v2.12
on:
  push:
    tags: ['v*']

permissions:
  contents: write           # least privilege: only needs to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt a publish midway

defaults:
  run:
    working-directory: packages/products/harvest-autofill

jobs:
  release:
    runs-on: macos-26       # needs the macOS 26 SDK (Liquid Glass APIs)
    timeout-minutes: 25
    steps:
      # Pinned to a full commit SHA (supply-chain hardening); the comment tracks the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # need the annotated tag object for the release notes
          persist-credentials: false

      - name: Compute version + build
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$(( MA*10000 + MI*100 + ${PA:-0} ))" >> "$GITHUB_OUTPUT"

      - name: Build the app
        env:
          VERSION: ${{ steps.v.outputs.version }}
          BUILD: ${{ steps.v.outputs.build }}
        run: ./build.sh "$VERSION" "$BUILD"

      - name: Write signing key
        env:
          KEY_B64: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: |
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/haf_priv.pem"
          chmod 600 "$RUNNER_TEMP/haf_priv.pem"

      - name: Release notes from CHANGELOG (also gates tag == VERSION == CHANGELOG)
        id: notes
        working-directory: ${{ github.workspace }} # scripts/version.mjs is at the repo root, not the app subdir
        run: |
          # version.mjs fails the build unless the tag matches VERSION and a released CHANGELOG.md
          # section, so a tag can never be published out of lockstep. On success it prints that
          # section, which becomes the release body. Node builtins only, so no install step.
          NOTES="$(node scripts/version.mjs --notes "$GITHUB_REF_NAME")"
          { echo "notes<<HAF_EOF"; echo "$NOTES"; echo "HAF_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Sign + publish the release
        env:                       # values passed via env (never interpolated into the command) to avoid injection
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAF_PRIV_KEY: ${{ runner.temp }}/haf_priv.pem
          VERSION: ${{ steps.v.outputs.version }}
          BUILD: ${{ steps.v.outputs.build }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: ./release.sh "$VERSION" "$BUILD" "$NOTES" "dist/Harvest Auto-Fill.app"

      - name: Wipe signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/haf_priv.pem"
