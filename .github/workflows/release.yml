name: Release
# Push a version tag (e.g. v2.10) to build, sign, and publish that release.
# Put the changelog in the annotated tag message: git tag -a v2.10 -m "## Changes…"; git push origin v2.10
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14   # arm64 (matches the bundled aarch64 Python)
    steps:
      - uses: actions/checkout@v4

      - name: Compute version + build
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$VERSION"
          BUILD=$(( MA*10000 + MI*100 + ${PA:-0} ))   # monotonic across versions
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"     >> "$GITHUB_OUTPUT"

      - name: Build the app
        run: ./build.sh "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.build }}"

      - name: Write signing key
        run: |
          echo "${{ secrets.ED25519_PRIVATE_KEY }}" | base64 --decode > "$RUNNER_TEMP/haf_priv.pem"
          chmod 600 "$RUNNER_TEMP/haf_priv.pem"

      - name: Release notes from the tag message
        id: notes
        run: |
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          [ -n "$NOTES" ] || NOTES="Release ${{ steps.v.outputs.version }}"
          { echo "notes<<HAF_EOF"; echo "$NOTES"; echo "HAF_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Sign + publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAF_PRIV_KEY: ${{ runner.temp }}/haf_priv.pem
        run: ./release.sh "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.build }}" "${{ steps.notes.outputs.notes }}" "dist/Harvest Auto-Fill.app"

      - name: Wipe signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/haf_priv.pem"
