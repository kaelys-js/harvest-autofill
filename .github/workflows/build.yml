name: Build
# Compile + assemble on every push/PR so breakage is caught before a release tag.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # least privilege: this workflow only reads the repo

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true  # a newer push supersedes an in-flight build

defaults:
  run:
    working-directory: packages/products/harvest-autofill

jobs:
  build:
    runs-on: macos-26       # needs the macOS 26 SDK (Liquid Glass APIs)
    timeout-minutes: 20
    steps:
      # Pinned to a full commit SHA (supply-chain hardening); the comment tracks the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (compile, bundle Python, sign, verify signature)
        run: ./build.sh
      - name: Confirm the app built
        run: test -f "dist/Harvest Auto-Fill.app/Contents/MacOS/Harvest"
