name: Web E2E
# Website E2E + visual regression, run inside the SAME pinned Playwright container the local
# `web-e2e` lefthook gate uses (mcr.microsoft.com/playwright), so browser rendering is
# byte-identical everywhere. The macOS Checks job can't run Linux containers, so this deferred
# check lives here; a dev's pre-push runs it locally via Docker, keeping local == CI.
on:
  push:
    branches: [main]
    paths:
      - "packages/products/website/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "packages/products/website/**"

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/products/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Website E2E + visual (Playwright, containerized)
        env:
          PLAYWRIGHT_IN_CONTAINER: "1"
        run: bash ./run-web-e2e.sh
