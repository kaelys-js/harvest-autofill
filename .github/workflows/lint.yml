name: Checks
# Format-check + lint every file type AND lint commit messages, using the mise-pinned
# tools via the same lefthook gate that runs on pre-push locally.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26       # SwiftLint needs a full Xcode (present on this runner)
    timeout-minutes: 20
    env:
      # Turbo remote cache (Vercel). If the TURBO_TOKEN secret is unset the run still
      # works — turbo falls back to the local .turbo cache restored below.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # need history to lint the commit range
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      # Cross-run turbo cache. Every gate stage runs `turbo run qa:<name>`, so an
      # unchanged surface (swift/python/web) restores from here instead of re-running.
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Install root deps (turbo)
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Install website deps (for the astro/css checks)
        run: mise exec -- pnpm install --frozen-lockfile
        working-directory: packages/products/website
      - name: Format-check + lint (all file types)
        run: mise exec -- lefthook run pre-push --all-files
      - name: Lint commit messages
        env:                       # values via env (never interpolated into the script) — injection-safe
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            mise exec -- commitlint --from "$PR_BASE" --to "$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            mise exec -- commitlint --from "$BEFORE" --to "$SHA"
          else
            mise exec -- commitlint --from "HEAD~1" --to HEAD
          fi
